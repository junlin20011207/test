name: ProofCut Isolated CAS Candidate CodeQL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cas-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify official CodeQL Actions 2.27.2
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          URL=https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-actions-linux64.tar.zst
          curl --fail --location --retry 3 --silent --show-error "$URL" -o "$RUNNER_TEMP/codeql-cas.tar.zst"
          echo "1878d7afa4a32d1109734e2ea6311bddc5f6da7be62fd6c9bf814e86d5da41ef  $RUNNER_TEMP/codeql-cas.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cas-codeql"
          tar --zstd -xf "$RUNNER_TEMP/codeql-cas.tar.zst" -C "$RUNNER_TEMP/cas-codeql"
          CODEQL_BIN=$(find "$RUNNER_TEMP/cas-codeql" -path '*/codeql/codeql' -type f -print -quit)
          test -n "$CODEQL_BIN"
          echo "CODEQL_BIN=$CODEQL_BIN" >> "$GITHUB_ENV"
          "$CODEQL_BIN" version
      - name: Validate new candidate 17/17 and scan with official CodeQL
        run: python -m benchmarks.ref_cas_candidate --codeql
      - name: Archive exact candidate, assertion JSON and independent SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ref-cas-codeql-single-candidate
          path: baseline-results/ref-cas-candidate/
          if-no-files-found: warn
          retention-days: 10
