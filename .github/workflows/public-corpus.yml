name: BoundaryGraph Pinned Public Corpus
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static parser only
        run: python -m pip install -r requirements.txt
      - name: Fetch and verify pinned public YAML without executing it
        run: python benchmarks/scan_public.py
      - name: Preserve complete and incomplete research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundarygraph-pinned-public-corpus
          path: baseline-results/public/
          retention-days: 14
          if-no-files-found: warn
